<script src="retail_sales_data.js"></script>
<script>
const K='retail_stockwise_v1',DAY=864e5;
let S=null,tab='overview',bill=[],note='';
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={shop:'',owner:'',city:'',setup:false,n:0,products:[],sales:[],exp:[],list:[]};
const RETAIL_DATA=Array.isArray(window.RETAIL_SALES_DATA)?window.RETAIL_SALES_DATA:[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const uid=()=>Math.random().toString(36).slice(2,9);
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const fd=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const sum=a=>a.reduce((x,y)=>x+y,0);
const V=id=>document.getElementById(id).value;
const pid=id=>S.products.find(p=>p.id===id);
const COST_RATIOS={Beauty:.55,Clothing:.60,Electronics:.70};
const datasetCost=(name,price)=>Math.round((+price||0)*(COST_RATIOS[name]??.60)*100)/100;

function applyDatasetCostModel(){
  const imported=S.sales.filter(s=>s.pay==='Dataset');
  if(!imported.length||S.datasetCostModel==='estimated')return;
  S.products.forEach(p=>{if(!p.cost)p.cost=datasetCost(p.name,p.price)});
  imported.forEach(s=>s.items.forEach(i=>{const p=pid(i.pid);i.cost=p&&p.cost>0?p.cost:datasetCost(i.name,i.price)}));
  S.datasetCostModel='estimated';save();
}

function retailSummary(){
  const cats={},genders={},dates=[];let revenue=0,units=0,cogs=0;
  RETAIL_DATA.forEach(([date,cat,qty,price,total,gender])=>{
    const q=+qty||0,a=+total||0,cost=q*datasetCost(cat,price);revenue+=a;units+=q;cogs+=cost;dates.push(date);
    const c=cats[cat]||(cats[cat]={name:cat,transactions:0,units:0,revenue:0,cogs:0});c.transactions++;c.units+=q;c.revenue+=a;c.cogs+=cost;
    genders[gender]=(genders[gender]||0)+1;
  });
  return {count:RETAIL_DATA.length,revenue,units,cogs,dates,cats:Object.values(cats).sort((a,b)=>b.revenue-a.revenue),genders};
}
function retailDataset(){
  const d=retailSummary();
  if(!d.count)return head()+`<div class="card empty"><h2>Retail dataset unavailable</h2><p>The bundled retail sales data could not be loaded.</p></div>`;
  const dates=[...d.dates].sort(),from=new Date(dates[0]+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),to=new Date(dates[dates.length-1]+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  const genderText=Object.entries(d.genders).map(([name,count])=>`${esc(name)}: ${count}`).join(' · ');
  return head()+`<div class="g4">
  <div class="card k1"><span class="mute">Dataset revenue</span><div class="big">${inr(d.revenue)}</div><div class="mute">${d.count.toLocaleString('en-IN')} transactions</div></div>
  <div class="card k2"><span class="mute">Estimated COGS</span><div class="big">${inr(d.cogs)}</div><div class="mute">Supplier cost estimate</div></div>
  <div class="card k3"><span class="mute">Estimated gross profit</span><div class="big">${inr(d.revenue-d.cogs)}</div><div class="mute">${pct(d.revenue-d.cogs,d.revenue)}% gross margin</div></div>
  <div class="card hi"><span class="mute">Sales period</span><div class="big" style="font-size:22px">2023</div><div class="mute">${from} – ${to}</div></div></div>
  <div class="g2"><div class="card"><h2>Sales by category</h2><div class="tw"><table><tr><th>Category</th><th>Transactions</th><th>Units</th><th>Revenue</th><th>Est. COGS</th><th>Gross profit</th></tr>${d.cats.map(c=>`<tr><td><span class="av">${ini(c.name)}</span>${esc(c.name)}</td><td>${c.transactions}</td><td>${c.units}</td><td><b>${inr(c.revenue)}</b></td><td>${inr(c.cogs)}</td><td class="pos">${inr(c.revenue-c.cogs)}</td></tr>`).join('')}</table></div></div>

function stats(){
  const latest=S.sales.length?Math.max(...S.sales.map(s=>s.ts)):Date.now(),t0=sod(latest),days=[...Array(14)].map((_,i)=>t0-(13-i)*DAY);
  const dt=days.map(d=>sum(S.sales.filter(s=>s.ts>=d&&s.ts<d+DAY).map(s=>s.amt)));
  const cur=dt.slice(7),prev=dt.slice(0,7),total=sum(cur),pt=sum(prev),wk=days[7];
  const exp=sum(S.exp.filter(e=>e.ts>=wk&&e.cat!=='Goods purchase').map(e=>e.amt));
  const growth=pt>0?Math.max(-.3,Math.min(.3,(total-pt)/pt)):(total>0?.05:0);
  const next=total*(1+growth),pred=[...Array(7)].map(()=>next/7);
  const units={},it={};S.sales.filter(s=>s.ts>=wk).forEach(s=>s.items.forEach(i=>{units[i.pid]=(units[i.pid]||0)+i.qty;const o=it[i.pid]||(it[i.pid]={name:i.name,q:0,rev:0,cost:0});o.q+=i.qty;o.rev+=i.qty*i.price;o.cost+=i.qty*icost(i)}));
  const cogs=sum(Object.values(it).map(o=>o.cost)),items=Object.values(it).map(o=>({...o,pr:o.rev-o.cost})).sort((a,b)=>b.pr-a.pr);
  const rows=S.products.map(p=>{const dem=Math.ceil((units[p.id]||0)*(1+growth));const re=Math.max(0,dem-p.stock);return{p,dem,re,low:p.stock<dem}}).sort((a,b)=>b.low-a.low||b.re-a.re);
  return{cur,pred,total,pt,exp,cogs,gross:total-cogs,items,profit:total-cogs-exp,growth,next,rows,count:S.sales.filter(s=>s.ts>=wk).length,t0};
}
function chart(st){

  const pp=[st.cur[6],...st.pred].map((v,i)=>(i?'L':'M')+x(6+i)+','+y(v)).join('');
  let g='';for(let k=0;k<=3;k++){const v=mx*k/3;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?Math.round(v/1000)+'k':Math.round(v)}</text>`}
  const xl=[0,3,6,9,13].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${fd(st.t0+(i-6)*DAY)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales for the last 7 days and the next 7 days"><rect x="${x(6)}" y="${T}" width="${W-R-x(6)}" height="${H-T-B}" fill="var(--sh)"/>${g}${xl}<path d="${ap}L${x(6)},${H-B}L${x(0)},${H-B}Z" fill="var(--gl)" opacity=".7"/><path d="${ap}" fill="none" stroke="var(--g)" stroke-width="2.5"/><path d="${pp}" fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 4"/></svg>`;
}

function saveProfile(){S.shop=V('fs').trim();S.owner=V('fo').trim();S.city=V('fc').trim();S.setup=true;save();render()}
let armed=false;
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='retail-stockwise-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products))throw 0;S=d;save();tab='overview';render()}catch(e){alert('That file is not a Retail Stockwise backup.')}};r.readAsText(f)}
function loadRetailData(force=false){
  if(!RETAIL_DATA.length)return alert('The bundled retail dataset is unavailable. Keep retail_sales_data.js next to this page.');
  if(!force&&(S.products.length||S.sales.length||S.exp.length)&&!confirm('Replace the current shop data with the bundled retail dataset? Your current data can be saved first from Settings.'))return;
  const d=retailSummary(),byCategory={};
  d.cats.forEach(c=>{const price=Math.round(c.revenue/c.units);byCategory[c.name]={id:uid(),name:c.name,unit:'units',stock:0,cost:datasetCost(c.name,price),mrp:price,price}});
  S={shop:'Retail Stockwise',owner:'',city:'',setup:true,n:RETAIL_DATA.length,products:Object.values(byCategory),sales:RETAIL_DATA.map(([date,cat,qty,price,total],i)=>({id:'RS-'+String(i+1).padStart(4,'0'),ts:new Date(date+'T12:00:00').getTime(),items:[{pid:byCategory[cat].id,name:cat,qty:+qty,price:+price,cost:datasetCost(cat,price)}],pay:'Dataset',amt:+total})),exp:[],list:[],datasetCostModel:'estimated'};
  bill=[];note='';save();tab='overview';render();
}
function settings(){return head()+profile(false)+`<div class="card"><h2>Your data</h2><p class="mute">Everything is saved on this device only. Clearing browser data will remove it.</p><div class="row"><button class="btn" onclick="exportData()">Save a backup file</button><label class="btn" style="cursor:pointer">Restore from backup<input type="file" accept=".json" style="display:none" onchange="importData(this.files[0])"></label><button class="btn" onclick="loadRetailData()">Load provided retail dataset</button><button class="btn" onclick="sample()">Load sample data</button><button class="btn" style="color:var(--bad)" onclick="if(armed){reset()}else{armed=true;this.textContent='Tap again to erase everything'}">Erase all my data</button></div></div>`}
function reset(){S={shop:'',owner:'',city:'',setup:false,n:0,products:[],sales:[],exp:[],list:[]};armed=false;bill=[];save();tab='overview';render()}
function sample(){
  const P=[['Sona Masoori Rice','kg',20,62,70,54],['Amul Taaza Milk (500 ml)','packs',24,28,29,26.5],['Sunflower Oil (1 L)','bottles',8,145,160,132],['Aashirvaad Atta (5 kg)','bags',30,235,260,215],['Parle-G Biscuits','packs',80,10,10,8.6],['Sugar','kg',25,46,52,41],['Tea (250 g)','packs',15,120,135,104]];
  S.products=P.map(([name,unit,stock,price,mrp,cost])=>({id:uid(),name,unit,stock,price,mrp,cost}));S.sales=[];S.exp=[];S.n=0;
  delete S.datasetCostModel;
  const t0=sod(Date.now()),r=n=>Math.floor(Math.random()*n);
  for(let d=13;d>=0;d--)for(let k=0,c=8+r(8);k<c;k++){
    const items=[...Array(1+r(3))].map(()=>{const p=S.products[r(7)];return{pid:p.id,name:p.name,qty:1+r(p.unit==='kg'?5:3),price:p.price,cost:p.cost}});
    S.n++;S.sales.push({id:'SW-'+(1000+S.n),ts:t0-d*DAY+(9+r(11))*36e5,items,pay:['Cash','UPI','UPI','Card'][r(4)],amt:sum(items.map(i=>i.qty*i.price))});
  }
  S.exp.push({id:uid(),cat:'Rent',amt:3500,ts:t0-3*DAY});
  S.exp.push({id:uid(),cat:'Electricity',amt:900,ts:t0-2*DAY},{id:uid(),cat:'Transport',amt:700,ts:t0-DAY});
  S.setup=true;save();tab='overview';render();
}
function go(t){tab=t;note='';window.scrollTo(0,0);render();if(t==='stock')pv()}
const TABS=[['overview','Overview'],['dataset','Dataset'],['sales','Sales'],['stock','Stock'],['expenses','Expenses'],['settings','Settings']];
function render(){
  const root=document.getElementById('root');
  if(!S.setup){root.innerHTML=`<div class="welcome">${brand()}${profile(true)}</div>`;return}
  const v={overview,dataset:retailDataset,sales,stock,expenses,settings}[tab]();
  root.innerHTML=`<div class="app"><nav class="side" aria-label="Main">${brand()}${TABS.map(([k,l])=>`<button class="nav ${k===tab?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICO[k]}</svg>${l}</button>`).join('')}<div class="shop"><span class="av2">${ini(S.owner||S.shop||'My')}</span><span><b>${esc(S.shop||'My shop')}</b>${esc(S.city)}</span></div></nav><main>${v}</main></div>`;
}
if(!S.setup){loadRetailData(true)}else{applyDatasetCostModel();render()}
</script></body></html>
